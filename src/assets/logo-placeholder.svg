<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Parody SPYDA MAN logo -->
  <defs>
    <style>
      .logo-text { font-family: Arial, sans-serif; font-weight: bold; fill: #dc2626; }
      .logo-accent { fill: #dc2626; }
    </style>
  </defs>
  
  <!-- Spider web background -->
  <circle cx="60" cy="60" r="58" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Spider body (simplified) -->
  <ellipse cx="60" cy="55" rx="12" ry="16" class="logo-accent"/>
  <circle cx="60" cy="35" r="10" class="logo-accent"/>
  
  <!-- Spider legs -->
  <line x1="50" y1="50" x2="30" y2="40" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="50" x2="90" y2="40" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="65" x2="25" y2="75" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="65" x2="95" y2="75" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Text -->
  <text x="60" y="105" text-anchor="middle" class="logo-text" font-size="12">SPYDA MAN</text>
</svg>